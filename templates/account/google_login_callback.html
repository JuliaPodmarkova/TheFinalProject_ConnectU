<!DOCTYPE html>
<html>
<head>
    <title>Аутентификация...</title>
    <script>
        // Проверяем, что окно было открыто как popup
        if (window.opener) {
            // Перезагружаем родительское окно (основную страницу сайта)
            window.opener.location.reload();
            // Закрываем текущее popup-окно
            window.close();
        } else {
            // Если кто-то зашел на эту страницу напрямую, просто перенаправляем на главную
            window.location.href = "/";
        }
    </script>
</head>
<body>
    <p>Пожалуйста, подождите...</p>
</body>
</html>
