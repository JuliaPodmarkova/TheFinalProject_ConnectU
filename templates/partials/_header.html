<header class="main-header sticky-top">
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">ConnectU</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}">Лента</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'match_list' %}">Мои мэтчи</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'match_list' %}">Сообщения</a>
                    </li>
                </ul>

                <form class="d-flex me-3" action="{% url 'search' %}" method="get">
                    <input class="form-control me-2" type="search" name="q" placeholder="Поиск" aria-label="Search">
                    <button class="btn btn-outline-primary" type="submit">🔍</button>
                </form>

                <ul class="navbar-nav">
                    {% if user.is_authenticated %}

                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">

                                <img src="{{ user.profile.get_avatar_url }}" alt="avatar" class="rounded-circle me-2" width="30" height="30" style="object-fit: cover;">

                                {{ user.profile.full_name|default:user.username }}
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                                <li><a class="dropdown-item" href="{% url 'profile_own' %}">🧐 Мой профиль</a></li>
                                <li><a class="dropdown-item" href="{% url 'profile_edit' %}">✏️ Редактировать</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="{% url 'logout' %}">🚪 Выйти</a></li>
                            </ul>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'login' %}">Войти</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'signup' %}">Регистрация</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>
</header>
