{% if profile_user %}
<div class="card shadow-lg border-0">
    <div class="card-img-top-wrapper">
        <a href="{% url 'profile_view' profile_user.id %}">
            <img src="{{ profile_user.profile.get_avatar_url }}" class="card-img-top" alt="{{ profile_user.profile.full_name }}">
        </a>
    </div>
    <div class="card-body text-center">
        <h4 class="card-title">
            <a href="{% url 'profile_view' profile_user.id %}" class="text-decoration-none text-dark">
                {{ profile_user.profile.full_name }}, {{ profile_user.age }}
            </a>
        </h4>
        <p class="card-text text-muted">
            <i class="fas fa-map-marker-alt me-1"></i>
            {{ profile_user.profile.city|default:"Город не указан" }}
        </p>
    </div>
    <div class="card-footer bg-white border-0 p-3">
        <div class="d-flex justify-content-around align-items-center">
            <button class="btn btn-outline-secondary btn-circle btn-lg"
                    hx-post="{% url 'swipe_action' %}"
                    hx-target="#swipe-card-container"
                    hx-swap="innerHTML"
                    hx-vals='{"user_id": "{{ profile_user.id }}", "action": "dislike"}'
                    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
                <i class="fas fa-times"></i>
            </button>
            <button class="btn btn-danger btn-circle btn-xl"
                    hx-post="{% url 'swipe_action' %}"
                    hx-target="#swipe-card-container"
                    hx-swap="innerHTML"
                    hx-vals='{"user_id": "{{ profile_user.id }}", "action": "like"}'
                    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
                <i class="fas fa-heart"></i>
            </button>
        </div>
    </div>
</div>
{% else %}
<div class="text-center p-5 d-flex flex-column justify-content-center align-items-center" style="min-height: 500px;">
    <i class="fas fa-users-slash fa-4x text-muted mb-3"></i>
    <h4 class="mb-3">Анкеты закончились</h4>
    <p class="text-muted">Зайдите попозже или измените критерии поиска.</p>
    <a href="{% url 'home' %}" class="btn btn-primary mt-2">Вернуться на главную</a>
</div>
{% endif %}
