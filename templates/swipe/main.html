{% extends "base.html" %}
{% load static %}

{% block title %}Знакомства | ConnectU{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 col-xl-5">
            <div id="swipe-card-container"
                 hx-get="{% url 'get_next_profile' %}"
                 hx-trigger="load"
                 hx-swap="innerHTML">
                <div class="d-flex justify-content-center align-items-center" style="min-height: 500px;">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Загрузка...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="matchModal" tabindex="-1" aria-labelledby="matchModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-center" style="background: linear-gradient(45deg, #ff8a80, #ff4081); border: none; color: white;">
            <div class="modal-body p-4">
                <h2 class="modal-title" id="matchModalLabel" style="font-weight: 700;">Это мэтч! ❤️</h2>
                <p class="lead mt-3">Вы и <strong id="matchName"></strong> понравились друг другу.</p>
                <img id="matchAvatar" src="" class="rounded-circle my-3" alt="avatar" width="120" height="120" style="border: 4px solid white; object-fit: cover;">
                <div class="d-grid gap-2">
                    <a href="{% url 'match_list' %}" class="btn btn-light btn-lg">Написать сообщение</a>
                    <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Продолжить поиск</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// Этот скрипт будет слушать событие 'matchOccurred'
document.body.addEventListener('matchOccurred', function(event) {
    const matchData = event.detail;
    if (matchData && matchData.matchName) {
        document.getElementById('matchName').textContent = matchData.matchName;
        document.getElementById('matchAvatar').src = matchData.matchAvatarUrl;
        const matchModal = new bootstrap.Modal(document.getElementById('matchModal'));
        matchModal.show();
    }
});
</script>
{% endblock %}
